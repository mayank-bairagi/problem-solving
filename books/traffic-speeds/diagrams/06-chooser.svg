<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 445" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="445" fill="#fff"/>
<text x="260" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">If the work is...</text><text x="800" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">...reach for</text><rect x="40" y="52" width="440" height="62" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="79.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Fits on one machine</text><text x="260.0" y="101.0" text-anchor="middle" font-size="14" fill="#444">up to roughly 100 GB touched</text><line x1="480" y1="83" x2="616" y2="83" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="52" width="360" height="62" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="800.0" y="79.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">DuckDB</text><text x="800.0" y="101.0" text-anchor="middle" font-size="14" fill="#444">one process, no cluster</text><rect x="40" y="128" width="440" height="62" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="155.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Ad-hoc over the lake, now and then</text><text x="260.0" y="177.0" text-anchor="middle" font-size="14" fill="#444">a few queries a day</text><line x1="480" y1="159" x2="616" y2="159" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="128" width="360" height="62" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="800.0" y="155.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Athena</text><text x="800.0" y="177.0" text-anchor="middle" font-size="14" fill="#444">no cluster, pay per scan</text><rect x="40" y="204" width="440" height="62" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="231.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Ad-hoc over the lake, all day</text><text x="260.0" y="253.0" text-anchor="middle" font-size="14" fill="#444">many analysts, steady use</text><line x1="480" y1="235" x2="616" y2="235" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="204" width="360" height="62" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="800.0" y="231.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Trino</text><text x="800.0" y="253.0" text-anchor="middle" font-size="14" fill="#444">your own cluster</text><rect x="40" y="280" width="440" height="62" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="307.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Dashboards, many users</text><text x="260.0" y="329.0" text-anchor="middle" font-size="14" fill="#444">same tables, sub-second</text><line x1="480" y1="311" x2="616" y2="311" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="280" width="360" height="62" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="800.0" y="307.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Warehouse</text><text x="800.0" y="329.0" text-anchor="middle" font-size="14" fill="#444">load a curated copy</text><rect x="40" y="356" width="440" height="62" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="383.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Hours-long transformation</text><text x="260.0" y="405.0" text-anchor="middle" font-size="14" fill="#444">terabytes shuffled</text><line x1="480" y1="387" x2="616" y2="387" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="356" width="360" height="62" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="800.0" y="383.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Spark</text><text x="800.0" y="405.0" text-anchor="middle" font-size="14" fill="#444">see Chapter 5</text>
</svg>
