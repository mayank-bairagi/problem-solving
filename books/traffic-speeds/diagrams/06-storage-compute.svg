<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="390" fill="#fff"/>
<text x="250" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Warehouse</text><text x="250" y="58" text-anchor="middle" font-size="14" fill="#444">storage and compute together</text><text x="790" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Query engine on a lake</text><text x="790" y="58" text-anchor="middle" font-size="14" fill="#444">storage and compute apart</text><line x1="520" y1="20" x2="520" y2="380" stroke="#222" stroke-width="1" stroke-dasharray="4 6"/><rect x="30" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="100.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 1</text><text x="100.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU + own disks</text><rect x="190" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 2</text><text x="260.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU + own disks</text><rect x="350" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="420.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 3</text><text x="420.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU + own disks</text><rect x="150" y="270" width="200" height="60" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="250.0" y="306.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Files to load</text><line x1="250" y1="270" x2="250" y2="184" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="262" y="232" text-anchor="start" font-size="14" font-style="italic" fill="#444">load step</text><text x="250" y="365" text-anchor="middle" font-size="15" fill="#111">Data is copied in. The engine owns it.</text><rect x="545" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="615.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Trino</text><text x="615.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU only</text><line x1="615" y1="180" x2="615" y2="266" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="705" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="775.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Spark</text><text x="775.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU only</text><line x1="775" y1="180" x2="775" y2="266" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="865" y="90" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="935.0" y="131.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Flink</text><text x="935.0" y="153.0" text-anchor="middle" font-size="14" fill="#444">CPU only</text><line x1="935" y1="180" x2="935" y2="266" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="545" y="270" width="460" height="60" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="775" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Object storage: one copy</text><text x="790" y="365" text-anchor="middle" font-size="15" fill="#111">Data stays put. Engines come and go.</text>
