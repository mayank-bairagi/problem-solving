<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="510" fill="#fff"/>
<rect x="40" y="30" width="480" height="66" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="280.0" y="59.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Catalog</text><text x="280.0" y="81.0" text-anchor="middle" font-size="14" fill="#444">table name -> current metadata file</text><line x1="280" y1="96" x2="280" y2="114" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="118" width="480" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="280.0" y="147.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Metadata file (.json)</text><text x="280.0" y="169.0" text-anchor="middle" font-size="14" fill="#444">schema, partition spec, list of snapshots</text><line x1="280" y1="184" x2="280" y2="202" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="206" width="480" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="280.0" y="235.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Manifest list (one per snapshot)</text><text x="280.0" y="257.0" text-anchor="middle" font-size="14" fill="#444">one row per manifest + range of partition values</text><line x1="280" y1="272" x2="280" y2="290" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="545" y="244" text-anchor="start" font-size="14" font-style="italic" fill="#111">prune 1: skip manifests for other days</text><rect x="40" y="294" width="480" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="280.0" y="323.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Manifest (.avro)</text><text x="280.0" y="345.0" text-anchor="middle" font-size="14" fill="#444">one row per data file + min/max of each column</text><line x1="280" y1="360" x2="280" y2="378" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="545" y="332" text-anchor="start" font-size="14" font-style="italic" fill="#111">prune 2: skip files that cannot hold segment 4471</text><rect x="40" y="382" width="480" height="66" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="280.0" y="411.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Data files (.parquet)</text><text x="280.0" y="433.0" text-anchor="middle" font-size="14" fill="#444">the pings</text><text x="545" y="420" text-anchor="start" font-size="14" font-style="italic" fill="#111">prune 3: skip row groups and columns (footer)</text><text x="520" y="490" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Query planning walks down this tree and discards most of it using metadata alone.</text>
</svg>
