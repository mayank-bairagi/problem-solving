<text x="260" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Must have one right answer</text><text x="780" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Close enough is fine</text><rect x="40" y="56" width="440" height="50" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="260.0" y="87.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Which snapshot is current</text><rect x="560" y="56" width="440" height="50" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="87.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Live speed on a road</text><rect x="40" y="120" width="440" height="50" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="260.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Who leads partition 0</text><rect x="560" y="120" width="440" height="50" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Typical speeds</text><rect x="40" y="184" width="440" height="50" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="260.0" y="215.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Who holds the compaction lease</text><rect x="560" y="184" width="440" height="50" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="215.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Analyst query results</text><rect x="40" y="248" width="440" height="50" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="260.0" y="279.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Was this jam report saved</text><rect x="560" y="248" width="440" height="50" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="279.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Dashboards and metrics</text><text x="260" y="335" text-anchor="middle" font-size="14" font-style="italic" fill="#444">cost: slower, and may refuse during a network cut</text><text x="780" y="335" text-anchor="middle" font-size="14" font-style="italic" fill="#444">cheap, fast, always answers, briefly stale</text><text x="520" y="380" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Pay for strong guarantees only where a wrong answer does damage.</text>
