<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 395" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="395" fill="#fff"/>
<text x="40" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">write</text><line x1="66" y1="75" x2="106" y2="75" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="40" width="240" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="230.0" y="71.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Table in memory</text><text x="230.0" y="93.0" text-anchor="middle" font-size="14" fill="#444">kept sorted</text><line x1="230" y1="110" x2="230" y2="206" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="245" y="160" text-anchor="start" font-size="14" font-style="italic" fill="#444">when full: written out as one sorted file</text><rect x="150" y="210" width="160" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="230.0" y="241.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File 3</text><text x="230.0" y="263.0" text-anchor="middle" font-size="14" fill="#444">newest</text><rect x="330" y="210" width="160" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="410.0" y="251.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File 2</text><rect x="510" y="210" width="160" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="590.0" y="241.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File 1</text><text x="590.0" y="263.0" text-anchor="middle" font-size="14" fill="#444">oldest</text><line x1="670" y1="245" x2="786" y2="245" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="728" y="232" text-anchor="middle" font-size="14" font-style="italic" fill="#444">merge</text><rect x="790" y="210" width="220" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="900.0" y="241.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">One bigger file</text><text x="900.0" y="263.0" text-anchor="middle" font-size="14" fill="#444">old versions dropped</text><text x="410" y="320" text-anchor="middle" font-size="14" font-style="italic" fill="#444">a read checks memory first, then files from newest to oldest</text><text x="520" y="375" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Writes only ever add. The tidying up happens later, in the background.</text>
</svg>
