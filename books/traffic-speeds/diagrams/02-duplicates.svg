<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="320" fill="#fff"/>
<rect x="35" y="110" width="170" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="120.0" y="146.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Read pings</text><text x="120.0" y="168.0" text-anchor="middle" font-size="14" fill="#444">5, 6, 7</text><line x1="205" y1="150" x2="231" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="235" y="110" width="170" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="320.0" y="146.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Add them to</text><text x="320.0" y="168.0" text-anchor="middle" font-size="14" fill="#444">the averages</text><line x1="405" y1="150" x2="431" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="435" y="110" width="170" height="80" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="520.0" y="146.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">CRASH</text><text x="520.0" y="168.0" text-anchor="middle" font-size="14" fill="#444">position not saved</text><line x1="605" y1="150" x2="631" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="635" y="110" width="170" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="720.0" y="146.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Restart</text><text x="720.0" y="168.0" text-anchor="middle" font-size="14" fill="#444">from position 5</text><line x1="805" y1="150" x2="831" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="835" y="110" width="170" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="920.0" y="146.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Add 5, 6, 7</text><text x="920.0" y="168.0" text-anchor="middle" font-size="14" fill="#444">again</text><line x1="35" y1="60" x2="1005" y2="60" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="45" text-anchor="middle" font-size="14" font-style="italic" fill="#444">time</text><text x="520" y="250" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Without protection: pings 5, 6 and 7 are counted twice.</text><text x="520" y="285" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Fix: every ping carries a unique ping_id, and the reader skips ids it has already seen.</text>
</svg>
