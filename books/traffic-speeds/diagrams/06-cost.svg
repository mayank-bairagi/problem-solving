<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 385" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="385" fill="#fff"/>
<text x="40" y="40" text-anchor="start" font-size="17" font-weight="bold" fill="#111">A year of raw pings, no filter</text><rect x="40" y="52" width="900" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="490" y="78" text-anchor="middle" font-size="15" fill="#111">1,300 TB scanned  =  about $6,500</text><text x="40" y="145" text-anchor="start" font-size="17" font-weight="bold" fill="#111">One week of raw pings, two columns</text><rect x="40" y="157" width="130" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="186" y="183" text-anchor="start" font-size="15" fill="#111">about 4 TB scanned  =  about $20</text><text x="40" y="250" text-anchor="start" font-size="17" font-weight="bold" fill="#111">One week of daily totals</text><rect x="40" y="262" width="16" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="72" y="288" text-anchor="start" font-size="15" fill="#111">about 50 GB scanned  =  about 25 cents</text><text x="520" y="365" text-anchor="middle" font-size="15" font-style="italic" fill="#111">The same question three ways, at $5 per TB scanned. Bars are not to scale.</text>
</svg>
