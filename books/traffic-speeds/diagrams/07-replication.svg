<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 405" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="405" fill="#fff"/>
<rect x="30" y="60" width="200" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="130.0" y="94.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">App</text><text x="130.0" y="116.0" text-anchor="middle" font-size="14" fill="#444">writes</text><line x1="230" y1="98" x2="396" y2="98" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="60" width="240" height="76" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="520.0" y="94.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Primary</text><text x="520.0" y="116.0" text-anchor="middle" font-size="14" fill="#444">zone A</text><line x1="640" y1="98" x2="756" y2="98" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="60" width="250" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="885.0" y="94.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Standby</text><text x="885.0" y="116.0" text-anchor="middle" font-size="14" fill="#444">zone B, takes over on failure</text><text x="698" y="86" text-anchor="middle" font-size="13" font-style="italic" fill="#444">copy first,</text><text x="698" y="124" text-anchor="middle" font-size="13" font-style="italic" fill="#444">then confirm</text><rect x="290" y="260" width="230" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="405.0" y="304.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Read replica 1</text><rect x="600" y="260" width="230" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="715.0" y="304.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Read replica 2</text><line x1="480" y1="136" x2="410" y2="256" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><line x1="560" y1="136" x2="700" y2="256" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="770" y="200" text-anchor="start" font-size="14" font-style="italic" fill="#444">copied a moment later</text><rect x="30" y="260" width="170" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="294.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">App</text><text x="115.0" y="316.0" text-anchor="middle" font-size="14" fill="#444">reads</text><line x1="200" y1="298" x2="286" y2="298" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="385" text-anchor="middle" font-size="15" font-style="italic" fill="#111">One place accepts writes. Copies give safety (standby) and read capacity (replicas).</text>
</svg>
