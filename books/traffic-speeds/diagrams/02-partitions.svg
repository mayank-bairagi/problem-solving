<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 465" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="465" fill="#fff"/>
<rect x="20" y="190" width="190" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="226.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Pings</text><text x="115.0" y="248.0" text-anchor="middle" font-size="14" fill="#444">devices A to E</text><line x1="210" y1="230" x2="266" y2="230" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="190" width="200" height="80" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="370.0" y="226.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">hash(device_id)</text><text x="370.0" y="248.0" text-anchor="middle" font-size="14" fill="#444">picks a partition</text><line x1="470" y1="230" x2="566" y2="98" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="570" y="60" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Partition 0</text><rect x="570" y="70" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="605.0" y="104.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">A1</text><rect x="640" y="70" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="675.0" y="104.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">D1</text><rect x="710" y="70" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="745.0" y="104.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">A2</text><rect x="780" y="70" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="815.0" y="104.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">D2</text><rect x="850" y="70" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="885.0" y="104.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">A3</text><line x1="470" y1="230" x2="566" y2="228" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="570" y="190" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Partition 1</text><rect x="570" y="200" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="605.0" y="234.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B1</text><rect x="640" y="200" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="675.0" y="234.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B2</text><rect x="710" y="200" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="745.0" y="234.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B3</text><line x1="470" y1="230" x2="566" y2="358" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="570" y="320" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Partition 2</text><rect x="570" y="330" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="605.0" y="364.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">C1</text><rect x="640" y="330" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="675.0" y="364.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">E1</text><rect x="710" y="330" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="745.0" y="364.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">C2</text><rect x="780" y="330" width="70" height="56" fill="#fff" stroke="#222" stroke-width="2"/><text x="815.0" y="364.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">E2</text><text x="520" y="440" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Each device's pings stay in order (A1, A2, A3). Across partitions there is no order.</text>
