 marker-end="url(#a)"/><line x1="265" y1="240" x2="480" y2="326" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="760" y1="240" x2="400" y2="326" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="790" y1="240" x2="570" y2="326" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="850" y1="240" x2="830" y2="326" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="125" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#444">a query that started</text><text x="125" y="308" text-anchor="middle" font-size="14" font-style="italic" fill="#444">on 41 finishes on 41</text><text x="520" y="430" text-anchor="middle" font-size="15" font-style="italic" fill="#111">File C exists before the swap, but no reader can see it until the pointer moves.</text>
