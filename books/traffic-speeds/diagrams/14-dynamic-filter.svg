<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 415" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="415" fill="#fff"/>
<rect x="30" y="50" width="300" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="180.0" y="88.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Scan segments</text><text x="180.0" y="110.0" text-anchor="middle" font-size="14" fill="#444">city = Pune: 20,000 rows</text><line x1="330" y1="92" x2="416" y2="92" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="50" width="240" height="84" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="540.0" y="88.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Build side</text><text x="540.0" y="110.0" text-anchor="middle" font-size="14" fill="#444">collect the 20,000 ids</text><line x1="660" y1="92" x2="746" y2="92" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="50" width="260" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="880.0" y="88.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Join</text><text x="880.0" y="110.0" text-anchor="middle" font-size="14" fill="#444">match ids</text><rect x="30" y="230" width="300" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="180.0" y="268.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Scan daily_totals</text><text x="180.0" y="290.0" text-anchor="middle" font-size="14" fill="#444">7 billion rows on paper</text><line x1="540" y1="134" x2="300" y2="226" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="375" y="185" text-anchor="end" font-size="15" font-weight="bold" fill="#111">"only these ids"</text><line x1="330" y1="272" x2="790" y2="138" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="180" y="340" text-anchor="middle" font-size="14" font-style="italic" fill="#444">files and row groups without those ids are skipped</text><text x="520" y="395" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Dynamic filtering: the small side of a join becomes a filter on the big side's scan.</text>
