<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 485" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="485" fill="#fff"/>
<rect x="60" y="30" width="560" height="400" fill="#fff" stroke="#222" stroke-width="2"/><text x="340" y="52" text-anchor="middle" font-size="13" fill="#444">PAR1  (start marker)</text><rect x="80" y="64" width="520" height="110" fill="#fff" stroke="#222" stroke-width="2"/><text x="92" y="84" text-anchor="start" font-size="14" font-weight="bold" fill="#111">Row group 1  (about 128 MB of rows)</text><rect x="96" y="94" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="173.0" y="123.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">segment_id</text><text x="173.0" y="145.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="262" y="94" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="339.0" y="123.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">speed_kmh</text><text x="339.0" y="145.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="428" y="94" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="505.0" y="123.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">event_time</text><text x="505.0" y="145.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="80" y="186" width="520" height="110" fill="#fff" stroke="#222" stroke-width="2"/><text x="92" y="206" text-anchor="start" font-size="14" font-weight="bold" fill="#111">Row group 2  (about 128 MB of rows)</text><rect x="96" y="216" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="173.0" y="245.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">segment_id</text><text x="173.0" y="267.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="262" y="216" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="339.0" y="245.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">speed_kmh</text><text x="339.0" y="267.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="428" y="216" width="154" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="505.0" y="245.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">event_time</text><text x="505.0" y="267.0" text-anchor="middle" font-size="14" fill="#444">pages, compressed</text><rect x="80" y="308" width="520" height="96" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="340" y="332" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Footer</text><text x="340" y="356" text-anchor="middle" font-size="14" fill="#111">schema; for each row group and column:</text><text x="340" y="378" text-anchor="middle" font-size="14" fill="#111">min, max, null count, where it starts</text><text x="340" y="422" text-anchor="middle" font-size="13" fill="#444">PAR1  (end marker)</text><line x1="760" y1="356" x2="606" y2="356" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="770" y="350" text-anchor="start" font-size="15" font-weight="bold" fill="#111">a reader starts here,</text><text x="770" y="372" text-anchor="start" font-size="15" font-weight="bold" fill="#111">then fetches only the</text><text x="770" y="394" text-anchor="start" font-size="15" font-weight="bold" fill="#111">chunks it needs</text><text x="770" y="100" text-anchor="start" font-size="14" fill="#444">one column chunk =</text><text x="770" y="120" text-anchor="start" font-size="14" fill="#444">one column's values</text><text x="770" y="140" text-anchor="start" font-size="14" fill="#444">for one row group</text><text x="520" y="465" text-anchor="middle" font-size="15" font-style="italic" fill="#111">The footer lets a reader skip whole row groups and columns without touching them.</text>
</svg>
