<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="290" fill="#fff"/>
<rect x="20" y="60" width="226" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="133.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">1. Write</text><text x="133.0" y="120.0" text-anchor="middle" font-size="14" fill="#444">into an open transaction</text><line x1="246" y1="102" x2="274" y2="102" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="278" y="60" width="226" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="391.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">2. Barrier arrives</text><text x="391.0" y="120.0" text-anchor="middle" font-size="14" fill="#444">flush, keep it open</text><line x1="504" y1="102" x2="532" y2="102" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="536" y="60" width="226" height="84" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="649.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">3. Checkpoint done</text><text x="649.0" y="120.0" text-anchor="middle" font-size="14" fill="#444">every operator has saved</text><line x1="762" y1="102" x2="790" y2="102" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="794" y="60" width="226" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="907.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">4. Commit</text><text x="907.0" y="120.0" text-anchor="middle" font-size="14" fill="#444">output becomes visible</text><path d="M20,170 L20,182 L504,182 L504,170" fill="none" stroke="#222" stroke-width="2"/><text x="262" y="206" text-anchor="middle" font-size="14" font-style="italic" fill="#111">crash here: abort the transaction, replay from the last checkpoint</text><path d="M536,170 L536,182 L1020,182 L1020,170" fill="none" stroke="#222" stroke-width="2"/><text x="778" y="206" text-anchor="middle" font-size="14" font-style="italic" fill="#111">crash here: on restart, finish the commit</text><text x="520" y="270" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Output is committed only once the checkpoint that covers it is safely stored.</text>
</svg>
