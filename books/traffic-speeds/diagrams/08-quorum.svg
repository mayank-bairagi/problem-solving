<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 365" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="365" fill="#fff"/>
<rect x="40" y="100" width="470" height="150" rx="10" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><rect x="620" y="100" width="320" height="150" rx="10" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="145" width="130" height="60" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="125.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 1</text><rect x="210" y="145" width="130" height="60" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="275.0" y="171.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 2</text><text x="275.0" y="193.0" text-anchor="middle" font-size="14" fill="#444">leader</text><rect x="360" y="145" width="130" height="60" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="425.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 3</text><rect x="640" y="145" width="130" height="60" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="705.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 4</text><rect x="790" y="145" width="130" height="60" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="855.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Node 5</text><line x1="565" y1="60" x2="565" y2="290" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/><text x="565" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">network cut</text><text x="275" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">3 of 5: a majority</text><text x="780" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">2 of 5: a minority</text><text x="275" y="280" text-anchor="middle" font-size="15" fill="#111">elects a leader and keeps working</text><text x="780" y="280" text-anchor="middle" font-size="15" fill="#111">refuses to decide anything</text><text x="520" y="345" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Any two majorities share at least one node, so two leaders can never both be elected.</text>
</svg>
