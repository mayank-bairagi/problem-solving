<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 285" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="285" fill="#fff"/>
<rect x="14" y="70" width="185" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="106.5" y="108.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Your query</text><text x="106.5" y="130.0" text-anchor="middle" font-size="14" fill="#444">SQL or DataFrame</text><line x1="199" y1="112" x2="215" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="219" y="70" width="185" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="311.5" y="108.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Logical plan</text><text x="311.5" y="130.0" text-anchor="middle" font-size="14" fill="#444">what to compute</text><line x1="404" y1="112" x2="420" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="424" y="70" width="185" height="84" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="516.5" y="108.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Optimised plan</text><text x="516.5" y="130.0" text-anchor="middle" font-size="14" fill="#444">filters pushed, columns cut</text><line x1="609" y1="112" x2="625" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="629" y="70" width="185" height="84" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="721.5" y="108.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Physical plan</text><text x="721.5" y="130.0" text-anchor="middle" font-size="14" fill="#444">join type, shuffles</text><line x1="814" y1="112" x2="830" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="834" y="70" width="185" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="926.5" y="108.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Generated code</text><text x="926.5" y="130.0" text-anchor="middle" font-size="14" fill="#444">one tight loop per stage</text><path d="M219,170 L219,182 L814,182 L814,170" fill="none" stroke="#222" stroke-width="2"/><text x="516" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Catalyst optimiser</text><text x="926" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Tungsten</text><text x="520" y="265" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Because Spark sees the whole query, it can rewrite it. A UDF is a black box it cannot see into.</text>
</svg>
