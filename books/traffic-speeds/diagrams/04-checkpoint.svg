<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 405" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="405" fill="#fff"/>
<rect x="80" y="170" width="880" height="44" fill="#fff" stroke="#222" stroke-width="2"/><rect x="380" y="170" width="380" height="44" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="230" y="198" text-anchor="middle" font-size="14" fill="#444">already counted</text><text x="570" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">read again after restart</text><text x="860" y="198" text-anchor="middle" font-size="14" fill="#444">not yet read</text><rect x="240" y="40" width="280" height="74" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="380.0" y="73.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Checkpoint</text><text x="380.0" y="95.0" text-anchor="middle" font-size="14" fill="#444">position 1000 + all sums and counts</text><line x1="380" y1="114" x2="380" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="760" y="120" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">CRASH</text><text x="760" y="142" text-anchor="middle" font-size="14" fill="#444">at position 1500</text><line x1="760" y1="148" x2="760" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="380" y="236" text-anchor="middle" font-size="14" fill="#444">1000</text><text x="760" y="236" text-anchor="middle" font-size="14" fill="#444">1500</text><path d="M760,250 C760,310 380,310 380,254" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="570" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">restart: load the checkpoint, go back to 1000</text><text x="520" y="385" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Position and state are saved together, so after a restart they always match.</text>
</svg>
