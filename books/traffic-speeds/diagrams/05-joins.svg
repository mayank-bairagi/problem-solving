<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 405" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="405" fill="#fff"/>
<text x="250" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Broadcast join</text><text x="790" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Shuffle join</text><line x1="520" y1="20" x2="520" y2="350" stroke="#222" stroke-width="1" stroke-dasharray="4 6"/><rect x="170" y="60" width="160" height="56" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="250.0" y="84.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Cities</text><text x="250.0" y="106.0" text-anchor="middle" font-size="14" fill="#444">2,000 rows</text><line x1="250" y1="116" x2="90" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="170" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="90.0" y="211.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Worker 1</text><text x="90.0" y="233.0" text-anchor="middle" font-size="14" fill="#444">big chunk + copy</text><line x1="250" y1="116" x2="250" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="170" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="250.0" y="211.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Worker 2</text><text x="250.0" y="233.0" text-anchor="middle" font-size="14" fill="#444">big chunk + copy</text><line x1="250" y1="116" x2="410" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="170" width="140" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="410.0" y="211.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Worker 3</text><text x="410.0" y="233.0" text-anchor="middle" font-size="14" fill="#444">big chunk + copy</text><text x="250" y="300" text-anchor="middle" font-size="15" fill="#111">The small table is copied to every worker.</text><text x="250" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">The big table does not move.</text><rect x="545" y="80" width="120" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="605.0" y="111.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Totals</text><text x="605.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">chunk 1</text><rect x="895" y="80" width="120" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="955.0" y="111.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Segments</text><text x="955.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">chunk 1</text><rect x="710" y="80" width="140" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="111.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Partition 0</text><text x="780.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">same keys meet</text><rect x="545" y="190" width="120" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="605.0" y="221.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Totals</text><text x="605.0" y="243.0" text-anchor="middle" font-size="14" fill="#444">chunk 2</text><rect x="895" y="190" width="120" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="955.0" y="221.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Segments</text><text x="955.0" y="243.0" text-anchor="middle" font-size="14" fill="#444">chunk 2</text><rect x="710" y="190" width="140" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="221.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Partition 1</text><text x="780.0" y="243.0" text-anchor="middle" font-size="14" fill="#444">same keys meet</text><line x1="665" y1="115" x2="706" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="895" y1="115" x2="854" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="665" y1="115" x2="706" y2="225" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="895" y1="115" x2="854" y2="225" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="665" y1="225" x2="706" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="895" y1="225" x2="854" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="665" y1="225" x2="706" y2="225" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="895" y1="225" x2="854" y2="225" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="790" y="300" text-anchor="middle" font-size="15" fill="#111">Both tables are regrouped by the join key.</text><text x="790" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Both tables move.</text><text x="520" y="385" text-anchor="middle" font-size="15" font-style="italic" fill="#111">If one side is small, copy it. If both are big, regroup both.</text>
