<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 415" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="415" fill="#fff"/>
<rect x="30" y="150" width="170" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="188.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">App servers</text><text x="115.0" y="210.0" text-anchor="middle" font-size="14" fill="#444">many connections</text><line x1="200" y1="192" x2="246" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="150" width="180" height="84" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="340.0" y="188.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Connection pool</text><text x="340.0" y="210.0" text-anchor="middle" font-size="14" fill="#444">few real connections</text><line x1="430" y1="192" x2="476" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="150" width="200" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="580.0" y="188.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Primary</text><text x="580.0" y="210.0" text-anchor="middle" font-size="14" fill="#444">zone A: all writes</text><rect x="780" y="40" width="230" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="895.0" y="78.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Standby</text><text x="895.0" y="100.0" text-anchor="middle" font-size="14" fill="#444">zone B: takes over on failure</text><rect x="780" y="260" width="230" height="84" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="895.0" y="298.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Read replica</text><text x="895.0" y="320.0" text-anchor="middle" font-size="14" fill="#444">serves reads, slightly behind</text><line x1="680" y1="170" x2="776" y2="100" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="680" y1="214" x2="776" y2="284" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="700" y="112" text-anchor="end" font-size="14" font-weight="bold" fill="#111">synchronous</text><text x="700" y="290" text-anchor="end" font-size="14" font-weight="bold" fill="#111">asynchronous</text><text x="700" y="130" text-anchor="end" font-size="12" font-style="italic" fill="#444">commit waits for it</text><text x="700" y="308" text-anchor="end" font-size="12" font-style="italic" fill="#444">commit does not wait</text><text x="520" y="395" text-anchor="middle" font-size="15" font-style="italic" fill="#111">The standby is for surviving a failure. Read replicas are for spreading read load.</text>
</svg>
