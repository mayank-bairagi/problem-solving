<rect x="30" y="130" width="220" height="90" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="140.0" y="171.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Raw pings</text><text x="140.0" y="193.0" text-anchor="middle" font-size="14" fill="#444">never changed</text><rect x="400" y="50" width="280" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="540.0" y="86.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Typical speeds v1</text><text x="540.0" y="108.0" text-anchor="middle" font-size="14" fill="#444">average</text><rect x="400" y="220" width="280" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="540.0" y="256.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Typical speeds v2</text><text x="540.0" y="278.0" text-anchor="middle" font-size="14" fill="#444">median (new logic)</text><line x1="250" y1="160" x2="396" y2="95" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="250" y1="190" x2="396" y2="255" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="830" y="130" width="180" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="920.0" y="181.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Readers</text><line x1="680" y1="95" x2="826" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="680" y1="255" x2="826" y2="190" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="770" y="105" text-anchor="middle" font-size="14" font-style="italic" fill="#444">most, for now</text><text x="770" y="255" text-anchor="middle" font-size="14" font-style="italic" fill="#444">a few, then more</text><text x="520" y="355" text-anchor="middle" font-size="15" font-style="italic" fill="#111">New logic is a new view built from the same raw data. Readers move across gradually.</text>
