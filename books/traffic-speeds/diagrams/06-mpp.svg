m</text><line x1="520" y1="116" x2="820" y2="196" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="276" x2="820" y2="346" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="334" y1="238" x2="406" y2="238" stroke="#222" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="634" y1="238" x2="706" y2="238" stroke="#222" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="370" y="228" text-anchor="middle" font-size="13" font-style="italic" fill="#444">rows</text><text x="670" y="228" text-anchor="middle" font-size="13" font-style="italic" fill="#444">rows</text><rect x="110" y="350" width="820" height="56" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="520" y="384" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Lake: Parquet files in Iceberg tables</text><text x="760" y="150" text-anchor="middle" font-size="14" font-style="italic" fill="#444">pieces of the plan</text><text x="370" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#444">each reads its share of files</text><text x="520" y="440" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Many machines work on one query at once. Data flows between them in memory.</text>
