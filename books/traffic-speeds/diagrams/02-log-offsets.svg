r than 7 days: deleted</text><line x1="985" y1="165" x2="905" y2="165" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="945" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">new pings</text><text x="945" y="130" text-anchor="middle" font-size="14" fill="#444">appended here</text><line x1="540" y1="255" x2="540" y2="204" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="540" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Lake writer has read up to 5</text><line x1="780" y1="310" x2="780" y2="204" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="780" y="333" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Stream job has read up to 8</text><text x="520" y="50" text-anchor="middle" font-size="17" fill="#111">The log: an ordered list of pings. Each has a number (its offset).</text><text x="520" y="385" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Reading does not remove anything. Each reader only remembers its own position.</text>
