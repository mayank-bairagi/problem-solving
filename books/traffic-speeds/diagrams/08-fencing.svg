<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="430" fill="#fff"/>
<text x="30" y="95" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Job A</text><text x="30" y="205" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Job B</text><text x="30" y="325" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Storage</text><rect x="130" y="60" width="200" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="230.0" y="89.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">gets the lease</text><text x="230.0" y="111.0" text-anchor="middle" font-size="14" fill="#444">token 33</text><rect x="340" y="70" width="450" height="46" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="565" y="99" text-anchor="middle" font-size="14" font-style="italic" fill="#111">paused (frozen for 40 s, lease expires)</text><rect x="810" y="60" width="200" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="910.0" y="89.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">wakes up, writes</text><text x="910.0" y="111.0" text-anchor="middle" font-size="14" fill="#444">token 33</text><rect x="380" y="170" width="200" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="480.0" y="199.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">gets the lease</text><text x="480.0" y="221.0" text-anchor="middle" font-size="14" fill="#444">token 34</text><rect x="600" y="170" width="180" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="690.0" y="199.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">writes</text><text x="690.0" y="221.0" text-anchor="middle" font-size="14" fill="#444">token 34</text><line x1="690" y1="236" x2="690" y2="286" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="910" y1="126" x2="910" y2="286" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="290" width="180" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="690.0" y="319.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">accepted</text><text x="690.0" y="341.0" text-anchor="middle" font-size="14" fill="#444">34 is newest</text><rect x="800" y="290" width="220" height="66" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="910.0" y="319.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">REJECTED</text><text x="910.0" y="341.0" text-anchor="middle" font-size="14" fill="#444">33 is older than 34</text><text x="520" y="410" text-anchor="middle" font-size="15" font-style="italic" fill="#111">The storage remembers the highest token it has seen and refuses anything older.</text>
