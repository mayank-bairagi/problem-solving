<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 435" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="435" fill="#fff"/>
<text x="190" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Stage 1: map tasks</text><text x="830" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Stage 2: reduce tasks</text><rect x="30" y="60" width="130" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="95.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Map 1</text><line x1="160" y1="92" x2="196" y2="92" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="66" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="250.0" y="98.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R0</text><rect x="300" y="66" width="100" height="52" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="350.0" y="98.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R1</text><rect x="400" y="66" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="450.0" y="98.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R2</text><line x1="504" y1="92" x2="746" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="60" width="250" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="875.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Reduce 0</text><rect x="30" y="160" width="130" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="95.0" y="198.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Map 2</text><line x1="160" y1="192" x2="196" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="166" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="250.0" y="198.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R0</text><rect x="300" y="166" width="100" height="52" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="350.0" y="198.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R1</text><rect x="400" y="166" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="450.0" y="198.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R2</text><line x1="504" y1="192" x2="746" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="160" width="250" height="64" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="875.0" y="188.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Reduce 1</text><text x="875.0" y="210.0" text-anchor="middle" font-size="14" fill="#444">fetches its slice from every map</text><rect x="30" y="260" width="130" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="95.0" y="298.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Map 3</text><line x1="160" y1="292" x2="196" y2="292" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="200" y="266" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="250.0" y="298.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R0</text><rect x="300" y="266" width="100" height="52" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="350.0" y="298.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R1</text><rect x="400" y="266" width="100" height="52" fill="#fff" stroke="#222" stroke-width="2"/><text x="450.0" y="298.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">for R2</text><line x1="504" y1="292" x2="746" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="260" width="250" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="875.0" y="298.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Reduce 2</text><text x="350" y="375" text-anchor="middle" font-size="14" font-style="italic" fill="#444">each map task writes