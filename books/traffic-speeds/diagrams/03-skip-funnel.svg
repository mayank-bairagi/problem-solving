<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="450" fill="#fff"/>
<text x="40" y="30" text-anchor="start" font-size="17" font-weight="bold" fill="#111">All pings, one year:  1,300 TB</text><rect x="40" y="42" width="960" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="40" y="130" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Only 12 November:  3.5 TB</text><rect x="40" y="142" width="420" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="476" y="168" text-anchor="start" font-size="14" font-style="italic" fill="#444">skipped the rest by: partitioning by day</text><text x="40" y="230" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Only files that can contain segment 4471:  about 35 GB</text><rect x="40" y="242" width="150" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="206" y="268" text-anchor="start" font-size="14" font-style="italic" fill="#444">skipped the rest by: min/max stats per file</text><text x="40" y="330" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Only the columns segment_id and speed:  about 5 GB</text><rect x="40" y="342" width="40" height="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="96" y="368" text-anchor="start" font-size="14" font-style="italic" fill="#444">skipped the rest by: column layout</text><text x="520" y="430" text-anchor="middle" font-size="15" font-style="italic" fill="#111">A good layout answers a query by not reading. (Sizes are illustrative.)</text>
</svg>
