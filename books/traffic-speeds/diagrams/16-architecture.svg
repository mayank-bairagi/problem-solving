<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="460" fill="#fff"/>
<rect x="30" y="40" width="220" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="140.0" y="74.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">DAG files</text><text x="140.0" y="96.0" text-anchor="middle" font-size="14" fill="#444">Python, kept in git</text><line x1="250" y1="78" x2="326" y2="78" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="40" width="240" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="450.0" y="74.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">DAG processor</text><text x="450.0" y="96.0" text-anchor="middle" font-size="14" fill="#444">parses the files</text><line x1="570" y1="90" x2="676" y2="170" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="150" width="320" height="96" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="840.0" y="194.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Metadata database</text><text x="840.0" y="216.0" text-anchor="middle" font-size="14" fill="#444">DAGs, runs, task states</text><rect x="330" y="170" width="240" height="76" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="450.0" y="204.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Scheduler</text><text x="450.0" y="226.0" text-anchor="middle" font-size="14" fill="#444">decides what runs next</text><line x1="574" y1="208" x2="676" y2="208" stroke="#222" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="450" y1="246" x2="450" y2="296" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="300" width="240" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="450.0" y="334.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Executor</text><text x="450.0" y="356.0" text-anchor="middle" font-size="14" fill="#444">hands tasks to workers</text><line x1="330" y1="338" x2="254" y2="338" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="300" width="220" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="140.0" y="334.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Workers</text><text x="140.0" y="356.0" text-anchor="middle" font-size="14" fill="#444">run the tasks</text><rect x="680" y="300" width="320" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="840.0" y="334.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">API server and web UI</text><text x="840.0" y="356.0" text-anchor="middle" font-size="14" fill="#444">people look, trigger, re-run</text><line x1="840" y1="296" x2="840" y2="250" stroke="#222" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="140" y="400" text-anchor="middle" font-size="13" font-style="italic" fill="#444">report state back</text><text x="520" y="440" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Everything Airflow knows is in the database. The scheduler reads it and writes it in a loop.</text>
</svg>
