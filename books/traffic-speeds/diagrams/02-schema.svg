<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 435" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="435" fill="#fff"/>
<rect x="30" y="60" width="250" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="155.0" y="101.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Old phone (v1)</text><text x="155.0" y="123.0" text-anchor="middle" font-size="14" fill="#444">segment, speed, time</text><rect x="30" y="270" width="250" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="155.0" y="311.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">New phone (v2)</text><text x="155.0" y="333.0" text-anchor="middle" font-size="14" fill="#444">segment, speed, time, heading</text><rect x="420" y="165" width="170" height="90" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="505.0" y="206.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Log</text><text x="505.0" y="228.0" text-anchor="middle" font-size="14" fill="#444">both versions mixed</text><rect x="730" y="60" width="280" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="870.0" y="101.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Old reader (v1)</text><text x="870.0" y="123.0" text-anchor="middle" font-size="14" fill="#444">sees heading: skips it</text><rect x="730" y="270" width="280" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="870.0" y="311.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">New reader (v2)</text><text x="870.0" y="333.0" text-anchor="middle" font-size="14" fill="#444">no heading: uses "unknown"</text><line x1="280" y1="115" x2="416" y2="190" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="305" x2="416" y2="232" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="590" y1="190" x2="726" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="590" y1="232" x2="726" y2="305" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="410" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Add fields with a default. Never remove or renumber a field that is in use.</text>
