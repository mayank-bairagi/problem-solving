<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="400" fill="#fff"/>
<text x="250" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Copy-on-write</text><text x="790" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Merge-on-read</text><line x1="520" y1="20" x2="520" y2="330" stroke="#222" stroke-width="1" stroke-dasharray="4 6"/><rect x="40" y="90" width="190" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="135.0" y="126.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File A</text><text x="135.0" y="148.0" text-anchor="middle" font-size="14" fill="#444">1,000,000 pings</text><line x1="230" y1="130" x2="286" y2="130" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="290" y="90" width="200" height="80" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="390.0" y="126.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File A (new)</text><text x="390.0" y="148.0" text-anchor="middle" font-size="14" fill="#444">999,990 pings</text><text x="260" y="215" text-anchor="middle" font-size="15" fill="#111">Rewrite the whole file without the 10 pings.</text><text x="260" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">slow to write, fast to read</text><rect x="560" y="60" width="190" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="655.0" y="91.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">File A</text><text x="655.0" y="113.0" text-anchor="middle" font-size="14" fill="#444">untouched</text><rect x="560" y="150" width="190" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="655.0" y="181.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Delete file</text><text x="655.0" y="203.0" text-anchor="middle" font-size="14" fill="#444">10 ping ids</text><line x1="750" y1="95" x2="826" y2="125" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="750" y1="185" x2="826" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="830" y="100" width="180" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="920.0" y="134.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Reader</text><text x="920.0" y="156.0" text-anchor="middle" font-size="14" fill="#444">A minus the 10</text><text x="790" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">fast to write, slower to read</text><text x="790" y="285" text-anchor="middle" font-size="15" fill="#111">Add a tiny file. Every reader subtracts.</text><text x="520" y="375" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Either way, old files are never edited. Compaction later folds delete files in.</text>
</svg>
