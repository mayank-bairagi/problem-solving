<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="440" fill="#fff"/>
  <path d="M80,360 C140,360 170,80 250,80 C330,80 360,250 460,300 C580,345 760,352 980,356 L980,360 Z" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="360" x2="1000" y2="360" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="50" stroke="#222" stroke-width="2"/>
  <g stroke="#222" stroke-width="2" stroke-dasharray="6 5">
    <line x1="290" y1="60" x2="290" y2="360"/>
    <line x1="620" y1="150" x2="620" y2="360"/>
    <line x1="860" y1="150" x2="860" y2="360"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <g font-size="18" font-weight="bold">
      <text x="290" y="48">p50 (median)</text>
      <text x="620" y="118">p95</text>
      <text x="860" y="118">p99</text>
    </g>
    <g font-size="14" fill="#444">
      <text x="290" y="384">20 ms</text>
      <text x="620" y="384">120 ms</text>
      <text x="860" y="384">400 ms</text>
      <text x="620" y="138">1 in 20 is slower</text>
      <text x="860" y="138">1 in 100 is slower</text>
    </g>
    <text x="540" y="420" font-size="16">response time of "speed on segment X?"</text>
    <text x="40" y="210" font-size="16" transform="rotate(-90 40 210)">number of requests</text>
    <text x="740" y="300" font-size="15" font-style="italic">the long tail</text>
  </g>
</svg>
