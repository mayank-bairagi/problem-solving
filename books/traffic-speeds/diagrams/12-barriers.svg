)"/><rect x="570" y="110" width="280" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="710.0" y="151.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Operator</text><text x="710.0" y="173.0" text-anchor="middle" font-size="14" fill="#444">saves state once both barriers are in</text><line x1="850" y1="155" x2="876" y2="155" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="880" y="120" width="145" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="952.5" y="151.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">next</text><text x="952.5" y="173.0" text-anchor="middle" font-size="14" fill="#444">barrier forwarded</text><line x1="710" y1="200" x2="710" y2="286" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="290" width="240" height="60" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="710.0" y="326.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Checkpoint storage</text><text x="520" y="395" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Waiting for the barrier on every input means the saved state reflects exactly the records before it.</text>
