<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="420" fill="#fff"/>
<rect x="380" y="30" width="280" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="520.0" y="61.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Stage 0  [SINGLE]</text><text x="520.0" y="83.0" text-anchor="middle" font-size="14" fill="#444">final sort, keep 10, return rows</text><rect x="380" y="150" width="280" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="520.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Stage 1  [HASH]</text><text x="520.0" y="203.0" text-anchor="middle" font-size="14" fill="#444">join, final sum per road</text><rect x="60" y="280" width="400" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="260.0" y="314.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Stage 2  [SOURCE]</text><text x="260.0" y="336.0" text-anchor="middle" font-size="14" fill="#444">scan daily_totals (7 days), partial sums</text><rect x="580" y="280" width="400" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="780.0" y="314.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Stage 3  [SOURCE]</text><text x="780.0" y="336.0" text-anchor="middle" font-size="14" fill="#444">scan segments, keep city = Pune</text><line x1="520" y1="150" x2="520" y2="104" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="280" x2="440" y2="224" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="780" y1="280" x2="600" y2="224" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="250" y="246" text-anchor="middle" font-size="13" font-style="italic" fill="#444">rows hashed by segment_id</text><text x="800" y="246" text-anchor="middle" font-size="13" font-style="italic" fill="#444">small: sent to every worker</text><text x="690" y="70" text-anchor="start" font-size="13" font-style="italic" fill="#444">runs on the coordinator</text><text x="690" y="190" text-anchor="start" font-size="13" font-style="italic" fill="#444">runs on all workers</text><text x="520" y="400" text-anchor="middle" font-size="15" font-style="italic" fill="#111">A query becomes a tree of stages. Data flows upward, in memory, between them.</text>
</svg>
