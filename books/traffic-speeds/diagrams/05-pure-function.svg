<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="335" fill="#fff"/>
<rect x="40" y="70" width="260" height="90" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="170.0" y="111.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Pings for 12 Nov</text><text x="170.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">input: never changes</text><line x1="300" y1="115" x2="386" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="70" width="240" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="510.0" y="111.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Nightly job</text><text x="510.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">reads, computes, nothing else</text><line x1="630" y1="115" x2="716" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="70" width="280" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="860.0" y="111.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Daily totals for 12 Nov</text><text x="860.0" y="133.0" text-anchor="middle" font-size="14" fill="#444">output: replaced as a whole</text><path d="M860,165 C860,250 510,250 510,168" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="685" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">run it again: same input, same output</text><text x="520" y="315" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Output = f(input). Nothing else is touched, so a re-run cannot make things worse.</text>
</svg>
