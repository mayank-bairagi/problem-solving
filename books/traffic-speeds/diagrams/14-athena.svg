e="italic" fill="#444">workgroup: caps bytes</text><text x="390" y="288" text-anchor="middle" font-size="13" font-style="italic" fill="#444">per query, tracks cost</text><text x="520" y="395" text-anchor="middle" font-size="15" font-style="italic" fill="#111">You manage tables and queries. The service supplies the compute, per query.</text>
