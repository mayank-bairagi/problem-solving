<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="350" fill="#fff"/>
<rect x="30" y="40" width="980" height="250" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><text x="520" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Executor container (what the cluster manager grants)</text><rect x="50" y="70" width="170" height="200" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><text x="135" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Overhead</text><text x="135" y="184" text-anchor="middle" font-size="13" fill="#444">outside the JVM heap</text><text x="135" y="204" text-anchor="middle" font-size="13" fill="#444">native, network buffers</text><rect x="240" y="70" width="750" height="200" rx="0" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="615" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">JVM heap (spark.executor.memory)</text><rect x="260" y="110" width="480" height="140" rx="0" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="500" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Unified region (about 60%)</text><rect x="275" y="150" width="200" height="84" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><text x="375" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Execution</text><text x="375" y="208" text-anchor="middle" font-size="13" fill="#444">shuffles, joins, sorts</text><rect x="525" y="150" width="200" height="84" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><text x="625" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Storage</text><text x="625" y="208" text-anchor="middle" font-size="13" fill="#444">cached data</text><line x1="479" y1="192" x2="521" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect x="760" y="110" width="210" height="140" rx="0" fill="#fff" stroke="#222" stroke-width="2"/><text x="865" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">User memory</text><text x="865" y="196" text-anchor="middle" font-size="13" fill="#444">your objects, UDF data</text><text x="520" y="330" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Execution and storage borrow from each other. Execution spills to disk when it runs out.</text>
</svg>
