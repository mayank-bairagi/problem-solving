:</text><text x="540" y="178" text-anchor="start" font-size="14" font-style="italic" fill="#111">result is published</text><circle cx="387" cy="268" r="8" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="372" y="273" text-anchor="end" font-size="14" font-style="italic" fill="#111">a ping for 08:14:40 arriving now is late</text><text x="520" y="375" text-anchor="middle" font-size="15" font-style="italic" fill="#111">The watermark trails the newest ping by a fixed wait. A window closes when the watermark passes its end.</text>
