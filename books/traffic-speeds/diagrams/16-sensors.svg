<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="390" fill="#fff"/>
<text x="30" y="86" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Sensor</text><text x="30" y="108" text-anchor="start" font-size="14" fill="#444">(poke mode)</text><rect x="190" y="60" width="800" height="56" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="590" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">occupies a worker slot for the whole wait</text><text x="30" y="216" text-anchor="start" font-size="17" font-weight="bold" fill="#111">Deferrable</text><text x="30" y="238" text-anchor="start" font-size="14" fill="#444">operator</text><rect x="190" y="190" width="80" height="56" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="230" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">start</text><rect x="270" y="190" width="640" height="56" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="590" y="224" text-anchor="middle" font-size="16" fill="#111">no worker: the triggerer watches</text><rect x="910" y="190" width="80" height="56" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="950" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">finish</text><line x1="190" y1="290" x2="990" y2="290" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="590" y="316" text-anchor="middle" font-size="14" font-style="italic" fill="#444">time spent waiting for the data to arrive</text><text x="520" y="370" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Waiting is not work. A deferred task frees its worker until the event arrives.</text>
</svg>
