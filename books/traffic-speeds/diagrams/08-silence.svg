<rect x="40" y="40" width="150" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="81.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Sender</text><rect x="470" y="40" width="170" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="555.0" y="81.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Receiver</text><line x1="190" y1="65" x2="320" y2="65" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="338" y="72" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">X</text><text x="680" y="81" text-anchor="start" font-size="15" fill="#111">The request was lost on the way</text><rect x="40" y="155" width="150" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="196.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Sender</text><rect x="470" y="155" width="170" height="70" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="555.0" y="196.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Receiver</text><line x1="190" y1="180" x2="466" y2="180" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="680" y="196" text-anchor="start" font-size="15" fill="#111">The other node crashed, or is very slow</text><rect x="40" y="270" width="150" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="115.0" y="311.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Sender</text><rect x="470" y="270" width="170" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="555.0" y="311.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Receiver</text><line x1="190" y1="295" x2="466" y2="295" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="470" y1="320" x2="342" y2="320" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="324" y="327" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">X</text><text x="680" y="311" text-anchor="start" font-size="15" fill="#111">It did the work, but the reply was lost</text><text x="520" y="400" text-anchor="middle" font-size="15" font-style="italic" fill="#111">From the sender's side, all three look exactly the same: silence.</text>
