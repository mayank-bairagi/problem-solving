<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="420" fill="#fff"/>
<rect x="400" y="30" width="240" height="64" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="520.0" y="68.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">All queries</text><line x1="520" y1="94" x2="180" y2="146" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="150" width="280" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="180.0" y="184.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">dashboards</text><text x="180.0" y="206.0" text-anchor="middle" font-size="14" fill="#444">20 at once, 40% memory</text><line x1="520" y1="94" x2="520" y2="146" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="150" width="280" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="520.0" y="184.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">ad hoc</text><text x="520.0" y="206.0" text-anchor="middle" font-size="14" fill="#444">10 at once, queue of 50</text><line x1="520" y1="94" x2="860" y2="146" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="150" width="280" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="860.0" y="184.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">scheduled</text><text x="860.0" y="206.0" text-anchor="middle" font-size="14" fill="#444">5 at once, 30% memory</text><rect x="380" y="290" width="280" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="520.0" y="318.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">11th ad hoc query</text><text x="520.0" y="340.0" text-anchor="middle" font-size="14" fill="#444">waits in the queue</text><line x1="520" y1="290" x2="520" y2="230" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="400" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Each group has its own limits, so one group's flood cannot starve the others.</text>
