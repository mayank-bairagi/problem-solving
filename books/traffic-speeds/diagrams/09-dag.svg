<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="380" fill="#fff"/>
<rect x="20" y="70" width="170" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="105.0" y="104.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Day complete?</text><text x="105.0" y="126.0" text-anchor="middle" font-size="14" fill="#444">wait for the lake</text><line x1="190" y1="108" x2="216" y2="108" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="70" width="190" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="315.0" y="104.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Daily totals</text><text x="315.0" y="126.0" text-anchor="middle" font-size="14" fill="#444">last 3 days</text><line x1="410" y1="108" x2="436" y2="108" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="70" width="170" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="525.0" y="104.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Typical speeds</text><text x="525.0" y="126.0" text-anchor="middle" font-size="14" fill="#444">last 56 days</text><line x1="610" y1="108" x2="636" y2="108" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="70" width="150" height="76" rx="8" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="715.0" y="104.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Checks</text><text x="715.0" y="126.0" text-anchor="middle" font-size="14" fill="#444">block if wrong</text><line x1="790" y1="108" x2="816" y2="108" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="70" width="200" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="920.0" y="104.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Publish</text><text x="920.0" y="126.0" text-anchor="middle" font-size="14" fill="#444">switch readers over</text><rect x="330" y="230" width="220" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="440.0" y="264.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Compare with stream</text><text x="440.0" y="286.0" text-anchor="middle" font-size="14" fill="#444">same hours, both paths</text><line x1="340" y1="146" x2="420" y2="226" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="250" x2="680" y2="150" stroke="#222" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="230" width="200" height="76" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="920.0" y="264.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Tidy up</text><text x="920.0" y="286.0" text-anchor="middle" font-size="14" fill="#444">compact, expire snapshots</text><line x1="920" y1="146" x2="920" y2="226" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="360" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Each box is a task for one named day. A task runs only after the ones before it succeed.</text>
</svg>
