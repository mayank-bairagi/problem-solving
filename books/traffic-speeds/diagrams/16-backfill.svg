<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 345" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1040" height="345" fill="#fff"/>
<text x="520" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Partitions of daily_totals, one per day</text><rect x="60" y="170" width="115" height="64" fill="#fff" stroke="#222" stroke-width="2"/><text x="117.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">7 Nov</text><rect x="175" y="170" width="115" height="64" fill="#fff" stroke="#222" stroke-width="2"/><text x="232.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">8 Nov</text><rect x="290" y="170" width="115" height="64" fill="#fff" stroke="#222" stroke-width="2"/><text x="347.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">9 Nov</text><rect x="405" y="170" width="115" height="64" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="462.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">10 Nov</text><rect x="520" y="170" width="115" height="64" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="577.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">11 Nov</text><rect x="635" y="170" width="115" height="64" fill="#e6e6e6" stroke="#222" stroke-width="2"/><text x="692.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">12 Nov</text><rect x="750" y="170" width="115" height="64" fill="#fff" stroke="#222" stroke-width="2"/><text x="807.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">13 Nov</text><rect x="865" y="170" width="115" height="64" fill="#fff" stroke="#222" stroke-width="2"/><text x="922.5" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">14 Nov</text><rect x="330" y="50" width="380" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="520.0" y="78.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Backfill 10 to 12 Nov</text><text x="520.0" y="100.0" text-anchor="middle" font-size="14" fill="#444">one run per day, each with its own dates</text><line x1="520" y1="114" x2="462" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="114" x2="577" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="114" x2="692" y2="166" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="520" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">each run replaces only its own day</text><text x="520" y="325" text-anchor="middle" font-size="15" font-style="italic" fill="#111">Because a run overwrites one partition and nothing else, re-running is safe, in any order.</text>
</svg>
